<html lang="en" class="scroll-smooth" style="background-color: #0A0C0F; color: #F6F2E9;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Explore the digital menu of Saffron House, view signature dishes, and order easily through WhatsApp." />
    <meta property="og:title" content="Saffron House | Digital Menu" />
    <meta property="og:description" content="Explore the digital menu of Saffron House, view signature dishes, and order easily through WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230E1116' stroke='%23C29E65' stroke-width='3'/><path d='M50 22 C36 22, 32 32, 32 40 C32 52, 68 50, 68 62 C68 70, 60 76, 50 76 C40 76, 34 70, 33 63' fill='none' stroke='%23C29E65' stroke-width='6' stroke-linecap='round'/><circle cx='64' cy='32' r='3.5' fill='%23E26421'/></svg>" />
    <!-- Direct luxury CSS bundle for zero-latency styling in VS Code Live Server -->
    <link rel="stylesheet" href="./dist/assets/main.css" onerror="this.href='./assets/main.css'" />
  </head>
  <body class="bg-[#0A0C0F] text-[#F6F2E9] antialiased selection:bg-[#E26421] selection:text-white" style="background-color: #0A0C0F; color: #F6F2E9; margin: 0; min-height: 100vh;">
    <div id="root"></div>

    <script type="module">
      // Dual-Mode Loader:
      // Supports both Vite Dev Server (AI Studio / local port 3000)
      // AND VS Code "Go Live" Live Server (port 5500 or any static server)
      const isViteEnvironment = Boolean(
        window.__vite_plugin_react_preamble_installed__ ||
        location.port === '3000' ||
        location.hostname.includes('run.app') ||
        location.hostname.includes('webcontainer')
      );

      if (isViteEnvironment) {
        import('/src/main.tsx').catch(() => {
          import('./dist/assets/main.js').catch(() => import('./assets/main.js'));
        });
      } else {
        // VS Code Live Server static mode: load compiled JS bundle
        import('./dist/assets/main.js').catch(() => {
          import('./assets/main.js');
        });
      }
    </script>
  </body>
</html>
